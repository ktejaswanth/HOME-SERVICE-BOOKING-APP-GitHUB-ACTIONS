# .coderabbit.yaml — CodeRabbit AI Review Configuration
language: "en-US"

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  profile: "assertive"
  request_changes_workflow: true

  path_instructions:
    - path: "Backend/**/*.java"
      instructions: |
        Review for Spring Boot best practices, security vulnerabilities,
        SQL injection risks, and proper exception handling.
    - path: "Frontend/src/**/*.jsx"
      instructions: |
        Review for React best practices, hook rules, accessibility,
        and performance anti-patterns.
    - path: "**/*.sql"
      instructions: |
        Flag any DROP TABLE, TRUNCATE, or destructive migration statements.
    - path: "docker-compose.yml"
      instructions: |
        Verify no hardcoded secrets, proper networking, and health checks.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 120000

chat:
  auto_reply: true
