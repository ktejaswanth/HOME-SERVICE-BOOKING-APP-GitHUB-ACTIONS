# ============================================================
# HOME SERVICE BOOKING APP — Spring Boot Configuration
# ============================================================

spring.application.name=HomeServe

# ============================================================
# DATABASE — Supabase PostgreSQL
# ============================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.zpzbjvbuizpdqzgdywdt.supabase.co:6543/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:your-supabase-db-password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt.secret=${JWT_SECRET_KEY:ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890MKDJSHIEUFBEICBWIEOWDWUU}
jwt.expiration=3600000

# ============================================================
# EMAIL — SMTP Configuration
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:ktejaswanth05@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tygtjkdkksbwxpro}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:ktejaswanth05@gmail.com}

# ============================================================
# ACTUATOR — Health + Prometheus Monitoring
# ============================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=HomeServe

# ============================================================
# SERVER
# ============================================================
server.port=${PORT:8080}
server.servlet.context-path=/

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.homeserve=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n