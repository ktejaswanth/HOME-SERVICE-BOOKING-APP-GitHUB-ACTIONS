services:
  # Backend: Spring Boot App
  - type: web
    name: homeserve-backend
    env: docker
    plan: free
    region: singapore
    dockerContext: Backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false # User must provide Supabase JDBC URL
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        fromService:
          name: homeserve-frontend
          type: static
          property: host
      - key: PORT
        value: 10000

  # Frontend: React (Vite) App
  - type: static
    name: homeserve-frontend
    env: static
    plan: free
    region: singapore
    buildCommand: cd Frontend && npm install && npm run build
    publishPath: Frontend/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        fromService:
          name: homeserve-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
